name: kuzhambu

services:
  nginx:
    image: "${KUZHAMBU_NGINX_IMAGE:-kuzhambu/nginx:1.27-alpine}"
    depends_on:
      - admin-web
      - portal-web
      - admin-starter
      - portal-starter
      - workers
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/kuzhambu.conf:/etc/nginx/conf.d/default.conf:ro

  admin-web:
    image: "${KUZHAMBU_ADMIN_WEB_IMAGE:-kuzhambu/admin-web:dev}"
    build:
      context: ..
      dockerfile: kuzhambu-apps/Dockerfile
      args:
        APP_NAME: admin-web
        VITE_ADMIN_WEB_BASE: ${ADMIN_WEB_BASE:-/kuzhambu-admin/}
        VITE_ADMIN_API_BASE_URL: ${ADMIN_API_BASE_URL:-/kuzhambu-admin-api/api}

  portal-web:
    image: "${KUZHAMBU_PORTAL_WEB_IMAGE:-kuzhambu/portal-web:dev}"
    build:
      context: ..
      dockerfile: kuzhambu-apps/Dockerfile
      args:
        APP_NAME: portal-web
        VITE_PORTAL_WEB_BASE: ${PORTAL_WEB_BASE:-/kuzhambu/}
        VITE_PORTAL_API_BASE_URL: ${PORTAL_API_BASE_URL:-/kuzhambu-api/api}

  admin-starter:
    image: "${KUZHAMBU_ADMIN_STARTER_IMAGE:-kuzhambu/admin-starter:dev}"
    build:
      context: ..
      dockerfile: kuzhambu-servers/Dockerfile
      args:
        STARTER_MODULE: kuzhambu-admin-starter
    depends_on:
      - mysql
      - redis
      - rocketmq-broker
      - elasticsearch
      - workers
    environment:
      JAVA_OPTS: ${JAVA_OPTS:-"-Xms512m -Xmx512m"}
      SERVER_PORT: 20010
      SERVER_SERVLET_CONTEXT_PATH: ${ADMIN_CONTEXT_PATH:-/kuzhambu-admin-api}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      KUZHAMBU_DB_DRIVER: com.mysql.cj.jdbc.Driver
      KUZHAMBU_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-kuzhambu}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      KUZHAMBU_DB_USERNAME: ${MYSQL_USERNAME:-kuzhambu}
      KUZHAMBU_DB_PASSWORD: ${MYSQL_PASSWORD:-kuzhambu}
      KUZHAMBU_REDIS_URI: redis://redis:6379/0
      KUZHAMBU_REDIS_PASSWORD: ${REDIS_PASSWORD:-kuzhambu}
      KUZHAMBU_REDIS_TIMEOUT: ${KUZHAMBU_REDIS_TIMEOUT:-5s}
      KUZHAMBU_JETCACHE_REDIS_URI: redis://:${REDIS_PASSWORD:-kuzhambu}@redis:6379/0
      KUZHAMBU_CACHE_STAT_INTERVAL_MINUTES: ${KUZHAMBU_CACHE_STAT_INTERVAL_MINUTES:-15}
      KUZHAMBU_ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      KUZHAMBU_ROCKETMQ_PRODUCER_GROUP: kuzhambu-admin-starter-producer
      KUZHAMBU_OPENAPI_ENABLED: ${KUZHAMBU_OPENAPI_ENABLED:-true}
      KUZHAMBU_MULTIPART_MAX_FILE_SIZE: ${KUZHAMBU_MULTIPART_MAX_FILE_SIZE:-20MB}
      KUZHAMBU_MULTIPART_MAX_REQUEST_SIZE: ${KUZHAMBU_MULTIPART_MAX_REQUEST_SIZE:-20MB}
      KUZHAMBU_LOG_PATH: /app/logs
      KUZHAMBU_LOG_LEVEL: ${KUZHAMBU_LOG_LEVEL:-INFO}
      KUZHAMBU_APP_LOG_LEVEL: ${KUZHAMBU_APP_LOG_LEVEL:-INFO}
      KUZHAMBU_LOG_MAX_HISTORY: ${KUZHAMBU_LOG_MAX_HISTORY:-30}
      KUZHAMBU_LOG_MAX_FILE_SIZE: ${KUZHAMBU_LOG_MAX_FILE_SIZE:-100MB}
      KUZHAMBU_LOG_TOTAL_SIZE_CAP: ${KUZHAMBU_LOG_TOTAL_SIZE_CAP:-5GB}
      KUZHAMBU_OSS_TYPE: ${KUZHAMBU_OSS_TYPE:-local}
      KUZHAMBU_OSS_LOCAL_ROOT_PATH: /app/storage/object
      KUZHAMBU_OSS_S3_ENDPOINT: ${KUZHAMBU_OSS_S3_ENDPOINT:-}
      KUZHAMBU_OSS_S3_REGION: ${KUZHAMBU_OSS_S3_REGION:-us-east-1}
      KUZHAMBU_OSS_S3_BUCKET: ${KUZHAMBU_OSS_S3_BUCKET:-}
      KUZHAMBU_OSS_S3_ACCESS_KEY: ${KUZHAMBU_OSS_S3_ACCESS_KEY:-}
      KUZHAMBU_OSS_S3_SECRET_KEY: ${KUZHAMBU_OSS_S3_SECRET_KEY:-}
      KUZHAMBU_OSS_S3_PATH_STYLE_ACCESS: ${KUZHAMBU_OSS_S3_PATH_STYLE_ACCESS:-true}
      KUZHAMBU_OSS_S3_LOCATION_PREFIX: ${KUZHAMBU_OSS_S3_LOCATION_PREFIX:-}
      KUZHAMBU_STORAGE_BUCKET_NAME: ${KUZHAMBU_STORAGE_BUCKET_NAME:-local}
      KUZHAMBU_STORAGE_CONTENT_PATH: ${ADMIN_STORAGE_CONTENT_PATH:-/kuzhambu-admin-api/api/storage/object/}
      KUZHAMBU_BACKUP_ROOT_PATH: ${KUZHAMBU_BACKUP_ROOT_PATH:-/backup/kuzhambu}
      KUZHAMBU_BACKUP_LOCAL_STORAGE_ROOT_PATH: /app/storage/object
      KUZHAMBU_ELASTICSEARCH_URIS: http://elasticsearch:9200
      KUZHAMBU_KNOWLEDGE_ENABLED: ${KUZHAMBU_KNOWLEDGE_ENABLED:-false}
      KUZHAMBU_KNOWLEDGE_PROVIDER: ${KUZHAMBU_KNOWLEDGE_PROVIDER:-fastgpt}
      KUZHAMBU_KNOWLEDGE_FASTGPT_BASE_URL: ${KUZHAMBU_KNOWLEDGE_FASTGPT_BASE_URL:-}
      KUZHAMBU_KNOWLEDGE_FASTGPT_API_KEY: ${KUZHAMBU_KNOWLEDGE_FASTGPT_API_KEY:-}
      KUZHAMBU_KNOWLEDGE_FASTGPT_APP_ID: ${KUZHAMBU_KNOWLEDGE_FASTGPT_APP_ID:-}
      KUZHAMBU_KNOWLEDGE_FASTGPT_TIMEOUT: ${KUZHAMBU_KNOWLEDGE_FASTGPT_TIMEOUT:-10s}
      KUZHAMBU_AI_WORKER_BASE_URL: http://workers:8000
      KUZHAMBU_AI_WORKER_INTERNAL_SECRET: ${KUZHAMBU_INTERNAL_SECRET:-change-me}
      KUZHAMBU_AI_WORKER_SERVICE_NAME: ${KUZHAMBU_AI_WORKER_SERVICE_NAME:-kuzhambu-ai}
      KUZHAMBU_AI_WORKER_TIMEOUT_MS: ${KUZHAMBU_AI_WORKER_TIMEOUT_MS:-60000}
    volumes:
      - storage-data:/app/storage
      - backup-data:${KUZHAMBU_BACKUP_ROOT_PATH:-/backup/kuzhambu}
      - ./scripts:/app/ops-scripts:ro
      - admin-logs:/app/logs

  portal-starter:
    image: "${KUZHAMBU_PORTAL_STARTER_IMAGE:-kuzhambu/portal-starter:dev}"
    build:
      context: ..
      dockerfile: kuzhambu-servers/Dockerfile
      args:
        STARTER_MODULE: kuzhambu-portal-starter
    depends_on:
      - mysql
      - redis
      - rocketmq-broker
      - elasticsearch
      - workers
    environment:
      JAVA_OPTS: ${JAVA_OPTS:-"-Xms512m -Xmx512m"}
      SERVER_PORT: 20011
      SERVER_SERVLET_CONTEXT_PATH: ${PORTAL_CONTEXT_PATH:-/kuzhambu-api}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      KUZHAMBU_DB_DRIVER: com.mysql.cj.jdbc.Driver
      KUZHAMBU_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-kuzhambu}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      KUZHAMBU_DB_USERNAME: ${MYSQL_USERNAME:-kuzhambu}
      KUZHAMBU_DB_PASSWORD: ${MYSQL_PASSWORD:-kuzhambu}
      KUZHAMBU_REDIS_URI: redis://redis:6379/0
      KUZHAMBU_REDIS_PASSWORD: ${REDIS_PASSWORD:-kuzhambu}
      KUZHAMBU_REDIS_TIMEOUT: ${KUZHAMBU_REDIS_TIMEOUT:-5s}
      KUZHAMBU_JETCACHE_REDIS_URI: redis://:${REDIS_PASSWORD:-kuzhambu}@redis:6379/0
      KUZHAMBU_CACHE_STAT_INTERVAL_MINUTES: ${KUZHAMBU_CACHE_STAT_INTERVAL_MINUTES:-15}
      KUZHAMBU_ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      KUZHAMBU_ROCKETMQ_PRODUCER_GROUP: kuzhambu-portal-starter-producer
      KUZHAMBU_OPENAPI_ENABLED: ${KUZHAMBU_OPENAPI_ENABLED:-true}
      KUZHAMBU_LOG_PATH: /app/logs
      KUZHAMBU_LOG_LEVEL: ${KUZHAMBU_LOG_LEVEL:-INFO}
      KUZHAMBU_APP_LOG_LEVEL: ${KUZHAMBU_APP_LOG_LEVEL:-INFO}
      KUZHAMBU_LOG_MAX_HISTORY: ${KUZHAMBU_LOG_MAX_HISTORY:-30}
      KUZHAMBU_LOG_MAX_FILE_SIZE: ${KUZHAMBU_LOG_MAX_FILE_SIZE:-100MB}
      KUZHAMBU_LOG_TOTAL_SIZE_CAP: ${KUZHAMBU_LOG_TOTAL_SIZE_CAP:-5GB}
      KUZHAMBU_OSS_TYPE: ${KUZHAMBU_OSS_TYPE:-local}
      KUZHAMBU_OSS_LOCAL_ROOT_PATH: /app/storage/object
      KUZHAMBU_OSS_S3_ENDPOINT: ${KUZHAMBU_OSS_S3_ENDPOINT:-}
      KUZHAMBU_OSS_S3_REGION: ${KUZHAMBU_OSS_S3_REGION:-us-east-1}
      KUZHAMBU_OSS_S3_BUCKET: ${KUZHAMBU_OSS_S3_BUCKET:-}
      KUZHAMBU_OSS_S3_ACCESS_KEY: ${KUZHAMBU_OSS_S3_ACCESS_KEY:-}
      KUZHAMBU_OSS_S3_SECRET_KEY: ${KUZHAMBU_OSS_S3_SECRET_KEY:-}
      KUZHAMBU_OSS_S3_PATH_STYLE_ACCESS: ${KUZHAMBU_OSS_S3_PATH_STYLE_ACCESS:-true}
      KUZHAMBU_OSS_S3_LOCATION_PREFIX: ${KUZHAMBU_OSS_S3_LOCATION_PREFIX:-}
      KUZHAMBU_STORAGE_BUCKET_NAME: ${KUZHAMBU_STORAGE_BUCKET_NAME:-local}
      KUZHAMBU_STORAGE_CONTENT_PATH: ${PORTAL_STORAGE_CONTENT_PATH:-/kuzhambu-api/api/storage/object/}
      KUZHAMBU_ELASTICSEARCH_URIS: http://elasticsearch:9200
      KUZHAMBU_KNOWLEDGE_ENABLED: ${KUZHAMBU_KNOWLEDGE_ENABLED:-false}
      KUZHAMBU_KNOWLEDGE_PROVIDER: ${KUZHAMBU_KNOWLEDGE_PROVIDER:-fastgpt}
      KUZHAMBU_KNOWLEDGE_FASTGPT_BASE_URL: ${KUZHAMBU_KNOWLEDGE_FASTGPT_BASE_URL:-}
      KUZHAMBU_KNOWLEDGE_FASTGPT_API_KEY: ${KUZHAMBU_KNOWLEDGE_FASTGPT_API_KEY:-}
      KUZHAMBU_KNOWLEDGE_FASTGPT_APP_ID: ${KUZHAMBU_KNOWLEDGE_FASTGPT_APP_ID:-}
      KUZHAMBU_KNOWLEDGE_FASTGPT_TIMEOUT: ${KUZHAMBU_KNOWLEDGE_FASTGPT_TIMEOUT:-10s}
    volumes:
      - storage-data:/app/storage
      - portal-logs:/app/logs

  workers:
    image: "${KUZHAMBU_WORKERS_IMAGE:-kuzhambu/workers:dev}"
    build:
      context: ..
      dockerfile: kuzhambu-workers/Dockerfile
    environment:
      KUZHAMBU_WORKER_ALLOWED_SERVICES: ${KUZHAMBU_WORKER_ALLOWED_SERVICES:-kuzhambu-ai}
      KUZHAMBU_WORKER_INTERNAL_SECRET: ${KUZHAMBU_INTERNAL_SECRET:-change-me}
      KUZHAMBU_WORKER_LOG_LEVEL: ${KUZHAMBU_WORKER_LOG_LEVEL:-INFO}
      KUZHAMBU_WORKER_TEMP_DIR: /tmp/kuzhambu-workers
    volumes:
      - workers-temp:/tmp/kuzhambu-workers

  mysql:
    image: "${KUZHAMBU_MYSQL_IMAGE:-kuzhambu/mysql:8.4}"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kuzhambu}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kuzhambu}
      MYSQL_USER: ${MYSQL_USERNAME:-kuzhambu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kuzhambu}
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: "${KUZHAMBU_REDIS_IMAGE:-kuzhambu/redis:7.2}"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-kuzhambu}
      - --save
      - ""
      - --appendonly
      - "no"

  elasticsearch:
    image: "${KUZHAMBU_ELASTICSEARCH_IMAGE:-kuzhambu/elasticsearch:8.15.3}"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:-"-Xms512m -Xmx512m"}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  rocketmq-namesrv:
    image: "${KUZHAMBU_ROCKETMQ_IMAGE:-kuzhambu/rocketmq:5.3.0}"
    command: sh mqnamesrv

  rocketmq-broker:
    image: "${KUZHAMBU_ROCKETMQ_IMAGE:-kuzhambu/rocketmq:5.3.0}"
    command: sh mqbroker -n rocketmq-namesrv:9876
    depends_on:
      - rocketmq-namesrv
    volumes:
      - rocketmq-store:/home/rocketmq/store

volumes:
  admin-logs:
  backup-data:
  elasticsearch-data:
  mysql-data:
  portal-logs:
  rocketmq-store:
  storage-data:
  workers-temp:
