upstream kuzhambu_admin_starter {
    server admin-starter:20010;
}

upstream kuzhambu_portal_starter {
    server portal-starter:20020;
}

upstream kuzhambu_workers {
    server workers:8000;
}

upstream kuzhambu_admin_web {
    server admin-web:80;
}

upstream kuzhambu_portal_web {
    server portal-web:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location = / {
        return 302 /kuzhambu/;
    }

    location = /kuzhambu-admin {
        return 308 /kuzhambu-admin/;
    }

    location = /kuzhambu {
        return 308 /kuzhambu/;
    }

    location = /kuzhambu-admin-api {
        return 308 /kuzhambu-admin-api/;
    }

    location = /kuzhambu-api {
        return 308 /kuzhambu-api/;
    }

    location /kuzhambu-admin-api/ {
        proxy_pass http://kuzhambu_admin_starter/kuzhambu-admin-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kuzhambu-api/ {
        proxy_pass http://kuzhambu_portal_starter/kuzhambu-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kuzhambu-admin/ {
        proxy_pass http://kuzhambu_admin_web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kuzhambu/ {
        proxy_pass http://kuzhambu_portal_web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /internal/admin/health {
        proxy_pass http://kuzhambu_admin_starter/kuzhambu-admin-api/actuator/health;
    }

    location /internal/admin/swagger-ui/ {
        rewrite ^/internal/admin/(.*)$ /kuzhambu-admin-api/$1 break;
        proxy_pass http://kuzhambu_admin_starter;
    }

    location /internal/admin/v3/api-docs {
        rewrite ^/internal/admin/(.*)$ /kuzhambu-admin-api/$1 break;
        proxy_pass http://kuzhambu_admin_starter;
    }

    location = /internal/portal/health {
        proxy_pass http://kuzhambu_portal_starter/kuzhambu-api/actuator/health;
    }

    location /internal/portal/swagger-ui/ {
        rewrite ^/internal/portal/(.*)$ /kuzhambu-api/$1 break;
        proxy_pass http://kuzhambu_portal_starter;
    }

    location /internal/portal/v3/api-docs {
        rewrite ^/internal/portal/(.*)$ /kuzhambu-api/$1 break;
        proxy_pass http://kuzhambu_portal_starter;
    }

    location /internal/workers/ {
        proxy_pass http://kuzhambu_workers/internal/;
    }
}
