# Include this file inside the host nginx `server { listen 80; }` block.

location = /kuzhambu-admin {
    return 308 /kuzhambu-admin/;
}

location = /kuzhambu {
    return 308 /kuzhambu/;
}

location = /kuzhambu-admin-api {
    return 308 /kuzhambu-admin-api/;
}

location = /kuzhambu-api {
    return 308 /kuzhambu-api/;
}

location /kuzhambu-admin/ {
    proxy_pass http://127.0.0.1:18080/kuzhambu-admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /kuzhambu/ {
    proxy_pass http://127.0.0.1:18080/kuzhambu/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /kuzhambu-admin-api/ {
    proxy_pass http://127.0.0.1:18080/kuzhambu-admin-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no;
}

location /kuzhambu-api/ {
    proxy_pass http://127.0.0.1:18080/kuzhambu-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no;
}
