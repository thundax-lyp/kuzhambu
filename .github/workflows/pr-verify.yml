name: PR Verify

on:
    pull_request:
        branches:
            - main
            - thundax-work
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    detect-changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        outputs:
            servers_changed: ${{ steps.changes.outputs.servers_changed }}
            backend_full_changed: ${{ steps.changes.outputs.backend_full_changed }}
            backend_projects: ${{ steps.changes.outputs.backend_projects }}
            workers_changed: ${{ steps.changes.outputs.workers_changed }}
            apps_changed: ${{ steps.changes.outputs.apps_changed }}
            apps_admin_changed: ${{ steps.changes.outputs.apps_admin_changed }}
            apps_portal_changed: ${{ steps.changes.outputs.apps_portal_changed }}
            db_changed: ${{ steps.changes.outputs.db_changed }}
            workflow_changed: ${{ steps.changes.outputs.verify_workflow_changed }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Detect changed paths
              id: changes
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    changed_files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
                  else
                    changed_files="$(git ls-files)"
                  fi

                  echo "$changed_files"

                  if echo "$changed_files" | grep -Eq '^(\.github/workflows/pr-verify.yml|\.github/pull_request_template.md)$'; then
                    verify_workflow_changed=true
                  else
                    verify_workflow_changed=false
                  fi

                  backend_full_changed=false
                  backend_projects_file="$(mktemp)"

                  resolve_backend_project() {
                    changed_file="$1"
                    changed_dir="${changed_file%/*}"

                    while [ "$changed_dir" != "." ] && [ "$changed_dir" != "kuzhambu-servers" ]; do
                      if [ -f "$changed_dir/pom.xml" ]; then
                        if grep -q '<modules>' "$changed_dir/pom.xml"; then
                          echo "__full__"
                          return
                        fi

                        echo "${changed_dir#kuzhambu-servers/}"
                        return
                      fi

                      changed_dir="${changed_dir%/*}"
                    done

                    echo "__full__"
                  }

                  if [ "$verify_workflow_changed" = "true" ] || echo "$changed_files" | grep -Eq '^(pom.xml$|kuzhambu-servers/(pom.xml|\.mvn/|checkstyle\.xml)|kuzhambu-servers/common/)'; then
                    backend_full_changed=true
                  elif echo "$changed_files" | grep -Eq '^kuzhambu-servers/'; then
                    while IFS= read -r changed_file; do
                      if ! echo "$changed_file" | grep -Eq '^kuzhambu-servers/'; then
                        continue
                      fi

                      backend_project="$(resolve_backend_project "$changed_file")"
                      if [ "$backend_project" = "__full__" ]; then
                        backend_full_changed=true
                        break
                      fi

                      echo "$backend_project" >> "$backend_projects_file"
                    done <<EOF
                  $changed_files
                  EOF
                  fi

                  backend_projects="$(sort -u "$backend_projects_file" | paste -sd, -)"

                  if [ "$backend_full_changed" = "true" ] || [ -n "$backend_projects" ]; then
                    servers_changed=true
                  else
                    servers_changed=false
                  fi

                  echo "servers_changed=$servers_changed" >> "$GITHUB_OUTPUT"
                  echo "backend_full_changed=$backend_full_changed" >> "$GITHUB_OUTPUT"
                  echo "backend_projects=$backend_projects" >> "$GITHUB_OUTPUT"

                  if [ "$verify_workflow_changed" = "true" ] || echo "$changed_files" | grep -Eq '^kuzhambu-workers/'; then
                    echo "workers_changed=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "workers_changed=false" >> "$GITHUB_OUTPUT"
                  fi

                  apps_changed=false
                  apps_admin_changed=false
                  apps_portal_changed=false
                  apps_root_changed=false

                  if [ "$verify_workflow_changed" = "true" ]; then
                    apps_changed=true
                    apps_admin_changed=true
                    apps_portal_changed=true
                  elif echo "$changed_files" | grep -Eq '^kuzhambu-apps/'; then
                    apps_changed=true

                    if echo "$changed_files" | grep -Eq '^kuzhambu-apps/admin-web/'; then
                      apps_admin_changed=true
                    fi

                    if echo "$changed_files" | grep -Eq '^kuzhambu-apps/portal-web/'; then
                      apps_portal_changed=true
                    fi

                    if echo "$changed_files" | grep -E '^kuzhambu-apps/' | grep -Evq '^kuzhambu-apps/(admin-web|portal-web)/'; then
                      apps_root_changed=true
                    fi

                    if [ "$apps_root_changed" = "true" ]; then
                      apps_admin_changed=true
                      apps_portal_changed=true
                    fi
                  fi

                  echo "apps_changed=$apps_changed" >> "$GITHUB_OUTPUT"
                  echo "apps_admin_changed=$apps_admin_changed" >> "$GITHUB_OUTPUT"
                  echo "apps_portal_changed=$apps_portal_changed" >> "$GITHUB_OUTPUT"

                  if [ "$verify_workflow_changed" = "true" ] || echo "$changed_files" | grep -Eq '^db/'; then
                    echo "db_changed=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "db_changed=false" >> "$GITHUB_OUTPUT"
                  fi

    verify-governance:
        name: Verify Governance
        needs: detect-changes
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Verify governance files
              run: |
                  test -f AGENTS.md
                  test -f docs/AGENTS.md
                  test -f docs/00-governance/ARCHITECTURE.md
                  test -f docs/00-governance/DOCUMENT-RULES.md
                  test -f docs/00-governance/SERVERS-ARCHITECTURE.md
                  test -f docs/00-governance/SERVERS-ARCHITECTURE-RULES.md
                  test -f docs/00-governance/TODO-RULES.md
                  test -f docs/00-governance/PR-RULES.md
                  test -f .github/pull_request_template.md
                  test -f .github/workflows/pr-verify.yml
                  if find docs -name '*.md' -print | grep -q ' '; then
                    echo "Document filenames must not contain spaces" >&2
                    exit 1
                  fi

    verify-backend:
        name: Verify Backend
        needs: detect-changes
        if: needs.detect-changes.outputs.servers_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"
                  cache: maven

            - name: Verify backend layout
              run: |
                  test -d kuzhambu-servers/common
                  test -d kuzhambu-servers/biz
                  test -d kuzhambu-servers/starter
                  test -d kuzhambu-servers/biz/system/kuzhambu-system-interface
                  test -d kuzhambu-servers/biz/system/kuzhambu-system-application
                  test -d kuzhambu-servers/biz/system/kuzhambu-system-domain
                  test -d kuzhambu-servers/biz/system/kuzhambu-system-infra
                  test -d kuzhambu-servers/starter/kuzhambu-admin-starter
                  test -d kuzhambu-servers/starter/kuzhambu-portal-starter
                  if test -d kuzhambu-servers/interfaces; then
                    echo "Legacy kuzhambu-servers/interfaces must be migrated to starter/domain interface modules" >&2
                    exit 1
                  fi

            - name: Verify backend formatting
              if: needs.detect-changes.outputs.backend_full_changed == 'true'
              working-directory: kuzhambu-servers
              run: mvn -q spotless:check

            - name: Verify affected backend formatting
              if: needs.detect-changes.outputs.backend_full_changed != 'true'
              working-directory: kuzhambu-servers
              run: mvn -q -pl "$BACKEND_PROJECTS" -am -amd spotless:check
              env:
                  BACKEND_PROJECTS: ${{ needs.detect-changes.outputs.backend_projects }}

            - name: Verify backend style
              if: needs.detect-changes.outputs.backend_full_changed == 'true'
              working-directory: kuzhambu-servers
              run: mvn -q checkstyle:check

            - name: Verify affected backend style
              if: needs.detect-changes.outputs.backend_full_changed != 'true'
              working-directory: kuzhambu-servers
              run: mvn -q -pl "$BACKEND_PROJECTS" -am -amd checkstyle:check
              env:
                  BACKEND_PROJECTS: ${{ needs.detect-changes.outputs.backend_projects }}

            - name: Verify backend tests
              if: needs.detect-changes.outputs.backend_full_changed == 'true'
              working-directory: kuzhambu-servers
              run: mvn -q test

            - name: Verify affected backend tests
              if: needs.detect-changes.outputs.backend_full_changed != 'true'
              working-directory: kuzhambu-servers
              run: mvn -q -pl "$BACKEND_PROJECTS" -am -amd test
              env:
                  BACKEND_PROJECTS: ${{ needs.detect-changes.outputs.backend_projects }}

    verify-apps:
        name: Verify Frontend
        needs: detect-changes
        if: needs.detect-changes.outputs.apps_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Enable Corepack
              run: corepack enable

            - name: Resolve pnpm store path
              id: pnpm-store
              working-directory: kuzhambu-apps
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('kuzhambu-apps/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Verify frontend package manifests
              run: |
                  node -e "JSON.parse(require('fs').readFileSync('kuzhambu-apps/package.json', 'utf8'))"
                  node -e "JSON.parse(require('fs').readFileSync('kuzhambu-apps/admin-web/package.json', 'utf8'))"
                  node -e "JSON.parse(require('fs').readFileSync('kuzhambu-apps/portal-web/package.json', 'utf8'))"

            - name: Install frontend dependencies
              working-directory: kuzhambu-apps
              run: pnpm install --frozen-lockfile

            - name: Verify admin frontend formatting
              if: needs.detect-changes.outputs.apps_admin_changed == 'true'
              working-directory: kuzhambu-apps
              run: pnpm --filter ./admin-web run format:check

            - name: Verify admin frontend lint
              if: needs.detect-changes.outputs.apps_admin_changed == 'true'
              working-directory: kuzhambu-apps
              run: pnpm --filter ./admin-web run lint

            - name: Verify admin frontend tests
              if: needs.detect-changes.outputs.apps_admin_changed == 'true'
              working-directory: kuzhambu-apps
              run: pnpm --filter ./admin-web run test

            - name: Verify portal frontend formatting
              if: needs.detect-changes.outputs.apps_portal_changed == 'true'
              working-directory: kuzhambu-apps
              run: pnpm --filter ./portal-web run format:check

            - name: Verify portal frontend lint
              if: needs.detect-changes.outputs.apps_portal_changed == 'true'
              working-directory: kuzhambu-apps
              run: pnpm --filter ./portal-web run lint

            - name: Verify portal frontend tests
              if: needs.detect-changes.outputs.apps_portal_changed == 'true'
              working-directory: kuzhambu-apps
              run: pnpm --filter ./portal-web run test

    verify-workers:
        name: Verify Python Workers
        needs: detect-changes
        if: needs.detect-changes.outputs.workers_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"
                  cache: pip

            - name: Verify Python worker manifest
              run: |
                  test -f kuzhambu-workers/pyproject.toml
                  grep -q 'name = "kuzhambu-workers"' kuzhambu-workers/pyproject.toml
                  grep -q 'requires-python = ">=3.10,<3.11"' kuzhambu-workers/pyproject.toml

            - name: Verify Python worker runtime
              run: |
                  python -c "import sys; assert sys.version_info[:2] == (3, 10), sys.version"

            - name: Install Python worker dependencies
              working-directory: kuzhambu-workers
              run: python -m pip install -e '.[dev]'

            - name: Verify Python worker formatting
              working-directory: kuzhambu-workers
              run: ruff format --check .

            - name: Verify Python worker lint
              working-directory: kuzhambu-workers
              run: ruff check .

            - name: Verify Python worker tests
              working-directory: kuzhambu-workers
              run: pytest

    verify-db:
        name: Verify Database
        needs: detect-changes
        if: needs.detect-changes.outputs.db_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Verify Classics SQL seed
              run: |
                  test -f db/schema/classics.sql
                  test -f db/data/classics.sql
                  grep -q 'CREATE TABLE IF NOT EXISTS `classics_sancai_category`' db/schema/classics.sql
                  grep -q 'CREATE TABLE IF NOT EXISTS `classics_sancai_volume`' db/schema/classics.sql
                  grep -q 'CREATE TABLE IF NOT EXISTS `classics_sancai_entry`' db/schema/classics.sql
                  grep -q 'CREATE TABLE IF NOT EXISTS `classics_wangqi_document`' db/schema/classics.sql
                  grep -q 'CREATE TABLE IF NOT EXISTS `classics_ming_customs_entry`' db/schema/classics.sql
                  grep -q 'CREATE TABLE IF NOT EXISTS `classics_share_link`' db/schema/classics.sql
                  grep -q 'INSERT INTO `classics_sancai_category`' db/data/classics.sql
                  grep -q 'INSERT INTO `classics_sancai_entry`' db/data/classics.sql
