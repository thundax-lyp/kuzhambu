[project]
name = "kuzhambu-workers"
version = "0.0.1-dev"
description = "Python worker capabilities for Kuzhambu"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi",
    "httpx",
    "langchain",
    "langgraph",
    "pillow",
    "pydantic",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
