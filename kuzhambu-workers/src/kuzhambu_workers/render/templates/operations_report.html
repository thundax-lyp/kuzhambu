<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 32px; color: #202124; }
    header { margin-bottom: 24px; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    .period { color: #5f6368; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0; }
    .metrics li { list-style: none; border: 1px solid #d5d8dc; padding: 12px; }
    .metrics span { display: block; color: #5f6368; font-size: 13px; }
    .metrics strong { display: block; font-size: 22px; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th, td { border-bottom: 1px solid #d5d8dc; padding: 10px; text-align: left; vertical-align: top; }
    th { background: #f6f8fa; }
  </style>
</head>
<body>
  <header>
    <h1>{{ title }}</h1>
    <div class="period">{{ period }}</div>
  </header>
  <ul class="metrics">
{{ metrics }}
  </ul>
  <table>
    <thead>
      <tr><th>Time</th><th>Type</th><th>Message</th></tr>
    </thead>
    <tbody>
{{ records }}
    </tbody>
  </table>
</body>
</html>
