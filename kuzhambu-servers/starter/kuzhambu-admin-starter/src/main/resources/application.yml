server:
  port: ${SERVER_PORT:20010}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/kuzhambu-admin-api}

spring:
  application:
    name: kuzhambu-admin-starter
  main:
    banner-mode: "off"
  redis:
    url: ${KUZHAMBU_REDIS_URI:redis://127.0.0.1:6379/0}
    password: ${KUZHAMBU_REDIS_PASSWORD:}
  datasource:
    driver-class-name: ${KUZHAMBU_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${KUZHAMBU_DB_URL:jdbc:mysql://127.0.0.1:3306/kuzhambu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${KUZHAMBU_DB_USERNAME:kuzhambu}
    password: ${KUZHAMBU_DB_PASSWORD:}
  data:
    redis:
      url: ${KUZHAMBU_REDIS_URI:redis://127.0.0.1:6379/0}
      password: ${KUZHAMBU_REDIS_PASSWORD:}
      timeout: ${KUZHAMBU_REDIS_TIMEOUT:5s}
  elasticsearch:
    uris: ${KUZHAMBU_ELASTICSEARCH_URIS:https://127.0.0.1:9200}
    username: ${KUZHAMBU_ELASTICSEARCH_USERNAME:elastic}
    password: ${KUZHAMBU_ELASTICSEARCH_PASSWORD:elastic}
  servlet:
    multipart:
      max-file-size: ${KUZHAMBU_MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${KUZHAMBU_MULTIPART_MAX_REQUEST_SIZE:20MB}

rocketmq:
  name-server: ${KUZHAMBU_ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${KUZHAMBU_ROCKETMQ_PRODUCER_GROUP:kuzhambu-admin-starter-producer}

springdoc:
  api-docs:
    enabled: ${KUZHAMBU_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${KUZHAMBU_OPENAPI_ENABLED:true}

jetcache:
  statIntervalMinutes: ${KUZHAMBU_CACHE_STAT_INTERVAL_MINUTES:15}
  local:
    default:
      type: linkedhashmap
      keyConvertor: FASTJSON2
  remote:
    default:
      type: redis.lettuce
      keyConvertor: FASTJSON2
      uri: ${KUZHAMBU_JETCACHE_REDIS_URI:${KUZHAMBU_REDIS_URI:redis://127.0.0.1:6379/0}}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  file:
    path: ${KUZHAMBU_LOG_PATH:logs}
  level:
    root: ${KUZHAMBU_LOG_LEVEL:INFO}
    com.thundax.kuzhambu: ${KUZHAMBU_APP_LOG_LEVEL:INFO}

kuzhambu:
  auth:
    captcha:
      whitelist-enabled: ${KUZHAMBU_AUTH_CAPTCHA_WHITELIST_ENABLED:false}
      whitelist-values: ${KUZHAMBU_AUTH_CAPTCHA_WHITELIST_VALUES:}
  logging:
    max-history: ${KUZHAMBU_LOG_MAX_HISTORY:30}
    max-file-size: ${KUZHAMBU_LOG_MAX_FILE_SIZE:100MB}
    total-size-cap: ${KUZHAMBU_LOG_TOTAL_SIZE_CAP:5GB}
  oss:
    type: ${KUZHAMBU_OSS_TYPE:local}
    local:
      root-path: ${KUZHAMBU_OSS_LOCAL_ROOT_PATH:storage}
    s3:
      endpoint: ${KUZHAMBU_OSS_S3_ENDPOINT:}
      region: ${KUZHAMBU_OSS_S3_REGION:us-east-1}
      bucket: ${KUZHAMBU_OSS_S3_BUCKET:}
      access-key: ${KUZHAMBU_OSS_S3_ACCESS_KEY:}
      secret-key: ${KUZHAMBU_OSS_S3_SECRET_KEY:}
      path-style-access: ${KUZHAMBU_OSS_S3_PATH_STYLE_ACCESS:true}
  ai:
    worker:
      base-url: ${KUZHAMBU_AI_WORKER_BASE_URL:http://127.0.0.1:8000}
      internal-secret: ${KUZHAMBU_AI_WORKER_INTERNAL_SECRET:}
      service-name: ${KUZHAMBU_AI_WORKER_SERVICE_NAME:kuzhambu-ai}
      timeout-ms: ${KUZHAMBU_AI_WORKER_TIMEOUT_MS:60000}
  storage:
    bucket-name: ${KUZHAMBU_STORAGE_BUCKET_NAME:local}
    content-path: ${KUZHAMBU_STORAGE_CONTENT_PATH:/kuzhambu-admin-api/api/storage/object/}
  classics:
    share:
      portal-web-base-url: ${KUZHAMBU_PORTAL_WEB_BASE_URL:http://localhost:5174}
  discovery:
    search:
      index-sync:
        topic: ${KUZHAMBU_DISCOVERY_SEARCH_INDEX_SYNC_TOPIC:kuzhambu.discovery.search.index-sync}
        producer-tag-upsert: ${KUZHAMBU_DISCOVERY_SEARCH_INDEX_SYNC_TAG_UPSERT:UPSERT}
        producer-tag-delete: ${KUZHAMBU_DISCOVERY_SEARCH_INDEX_SYNC_TAG_DELETE:DELETE}
        consumer-group: ${KUZHAMBU_DISCOVERY_SEARCH_INDEX_SYNC_CONSUMER_GROUP:kuzhambu-discovery-search-index-sync-consumer}
        consumer-enabled: ${KUZHAMBU_DISCOVERY_SEARCH_INDEX_SYNC_CONSUMER_ENABLED:true}
        deleted-retention-days: ${KUZHAMBU_DISCOVERY_SEARCH_INDEX_SYNC_DELETED_RETENTION_DAYS:7}
        deleted-cleanup-cron: ${KUZHAMBU_DISCOVERY_SEARCH_INDEX_SYNC_DELETED_CLEANUP_CRON:0 0 3 * * ?}
  operations:
    backup:
      root-path: ${KUZHAMBU_BACKUP_ROOT_PATH:/backup/kuzhambu}
      schedule:
        enabled: ${KUZHAMBU_OPERATIONS_BACKUP_SCHEDULE_ENABLED:true}
        startup-enabled: ${KUZHAMBU_OPERATIONS_BACKUP_STARTUP_ENABLED:true}
        daily-cron: ${KUZHAMBU_OPERATIONS_BACKUP_DAILY_CRON:0 0 2 * * ?}
    cleanup:
      schedule:
        enabled: ${KUZHAMBU_OPERATIONS_CLEANUP_SCHEDULE_ENABLED:true}
        startup-enabled: ${KUZHAMBU_OPERATIONS_CLEANUP_STARTUP_ENABLED:false}
        daily-cron: ${KUZHAMBU_OPERATIONS_CLEANUP_DAILY_CRON:0 30 3 * * ?}
        default-limit: ${KUZHAMBU_OPERATIONS_CLEANUP_DEFAULT_LIMIT:200}
        policies:
          expired-backup:
            enabled: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_BACKUP_ENABLED:true}
            retention-days: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_BACKUP_RETENTION_DAYS:30}
            limit: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_BACKUP_LIMIT:200}
          expired-export:
            enabled: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_EXPORT_ENABLED:true}
            retention-days: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_EXPORT_RETENTION_DAYS:7}
            limit: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_EXPORT_LIMIT:200}
          expired-share:
            enabled: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_SHARE_ENABLED:true}
            retention-days: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_SHARE_RETENTION_DAYS:90}
            limit: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_SHARE_LIMIT:200}
          expired-draft:
            enabled: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_DRAFT_ENABLED:true}
            retention-days: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_DRAFT_RETENTION_DAYS:30}
            limit: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_DRAFT_LIMIT:200}
          expired-report:
            enabled: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_REPORT_ENABLED:true}
            retention-days: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_REPORT_RETENTION_DAYS:90}
            limit: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_REPORT_LIMIT:200}
          expired-health-check:
            enabled: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_HEALTH_CHECK_ENABLED:true}
            retention-days: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_HEALTH_CHECK_RETENTION_DAYS:30}
            limit: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_HEALTH_CHECK_LIMIT:500}
          expired-long-task:
            enabled: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_LONG_TASK_ENABLED:true}
            retention-days: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_LONG_TASK_RETENTION_DAYS:90}
            limit: ${KUZHAMBU_OPERATIONS_CLEANUP_EXPIRED_LONG_TASK_LIMIT:200}
    health:
      probes:
        enabled: ${KUZHAMBU_OPERATIONS_HEALTH_PROBES_ENABLED:false}
        timeout-ms: ${KUZHAMBU_OPERATIONS_HEALTH_PROBES_TIMEOUT_MS:3000}
        targets:
          - enabled: ${KUZHAMBU_OPERATIONS_HEALTH_PROBES_TARGETS_0_ENABLED:true}
            component: ${KUZHAMBU_OPERATIONS_HEALTH_PROBES_TARGETS_0_COMPONENT:admin-starter}
            url: ${KUZHAMBU_OPERATIONS_HEALTH_PROBES_TARGETS_0_URL:http://127.0.0.1:20010/kuzhambu-admin-api/actuator/health}
            expected-status: ${KUZHAMBU_OPERATIONS_HEALTH_PROBES_TARGETS_0_EXPECTED_STATUS:200}
            degraded-latency-ms: ${KUZHAMBU_OPERATIONS_HEALTH_PROBES_TARGETS_0_DEGRADED_LATENCY_MS:1000}
